- name: merges multiple routes between same hosts
  input:
    name: duplicate-route-mesh
    hosts:
      - name: bastion-1
        endpoint: 10.0.0.1:51820
        egressInterface: eth0
        interface:
          address: 172.20.0.1/32
      - name: client-1
        interface:
          address: 172.20.0.2/32
    routes:
      - from: client-1
        to: bastion-1
        persistentKeepalive: 25
        allowedIps:
          - 10.10.0.0/16
      - from: client-1
        to: bastion-1
        persistentKeepalive: 25
        allowedIps:
          - 10.20.0.0/16
  expectedOutput:
    hosts:
      bastion-1:
        interface:
          address: 172.20.0.1/32
          listenPort: 51820
          postUp:
            - iptables -t nat -A POSTROUTING -s 172.20.0.2/32 -d 10.10.0.0/16 -o eth0 -j MASQUERADE
            - iptables -A FORWARD -i %i -s 172.20.0.2/32 -d 10.10.0.0/16 -j ACCEPT
            - iptables -A FORWARD -i eth0 -s 10.10.0.0/16 -d 172.20.0.2/32 -j ACCEPT
            - iptables -t nat -A POSTROUTING -s 172.20.0.2/32 -d 10.20.0.0/16 -o eth0 -j MASQUERADE
            - iptables -A FORWARD -i %i -s 172.20.0.2/32 -d 10.20.0.0/16 -j ACCEPT
            - iptables -A FORWARD -i eth0 -s 10.20.0.0/16 -d 172.20.0.2/32 -j ACCEPT
            - iptables -A FORWARD -i %i -j DROP
            - iptables -A FORWARD -o %i -j DROP
          postDown:
            - iptables -t nat -D POSTROUTING -s 172.20.0.2/32 -d 10.10.0.0/16 -o eth0 -j MASQUERADE
            - iptables -D FORWARD -i %i -s 172.20.0.2/32 -d 10.10.0.0/16 -j ACCEPT
            - iptables -D FORWARD -i eth0 -s 10.10.0.0/16 -d 172.20.0.2/32 -j ACCEPT
            - iptables -t nat -D POSTROUTING -s 172.20.0.2/32 -d 10.20.0.0/16 -o eth0 -j MASQUERADE
            - iptables -D FORWARD -i %i -s 172.20.0.2/32 -d 10.20.0.0/16 -j ACCEPT
            - iptables -D FORWARD -i eth0 -s 10.20.0.0/16 -d 172.20.0.2/32 -j ACCEPT
            - iptables -D FORWARD -i %i -j DROP
            - iptables -D FORWARD -o %i -j DROP
        peers:
          client-1:
            allowedIps:
              - 172.20.0.2/32
      client-1:
        interface:
          address: 172.20.0.2/32
        peers:
          bastion-1:
            endpoint: 10.0.0.1:51820
            allowedIps:
              - 10.10.0.0/16
              - 10.20.0.0/16
            persistentKeepalive: 25

- name: routed route omits masquerade
  input:
