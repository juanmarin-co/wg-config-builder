    routes:
      - from: developer-1
        to: bastion-dev
        persistentKeepalive: 25
        allowedIps:
          - 10.1.0.0/16
      - from: developer-1
        to: bastion-prod
        persistentKeepalive: 25
        allowedIps:
          - 10.0.0.0/16
      - from: developer-2
        to: bastion-dev
        persistentKeepalive: 25
        allowedIps:
          - 10.1.0.0/16
      - from: developer-2
        to: bastion-prod
        persistentKeepalive: 25
        allowedIps:
          - 10.0.0.0/16
      - from: developer-3
        to: bastion-dev
        persistentKeepalive: 25
        allowedIps:
          - 10.1.0.0/16
      - from: developer-3
        to: bastion-prod
        persistentKeepalive: 25
        allowedIps:
          - 10.0.0.0/16
  expectedOutput:
    hosts:
      bastion-dev:
        interface:
          address: 172.20.10.1/32
          listenPort: 51820
          postUp:
            - iptables -t nat -A POSTROUTING -o ens4 -j MASQUERADE
